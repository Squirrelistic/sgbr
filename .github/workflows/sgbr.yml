name: sgbr

on:
  push:
    branches: [ "main", "upgrade-to-dotnet9" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x

    - name: Test
      run: dotnet test
      working-directory: sgbr.tests
